name: Build narrated course animations
on:
  push:
    paths:
      - "scripts/build_narrated.py"
      - "course-guided.js"
      - ".github/workflows/build_narrated.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare text-to-speech and video encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak ffmpeg fonts-dejavu-core
          python -m pip install --quiet pillow
      - name: Render six bilingual narrated lessons
        run: python scripts/build_narrated.py
      - name: Save generated videos on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/videos/guide-*.mp4
          git diff --cached --quiet || (git commit -m "Publish narrated educational animations" && git push origin HEAD:main)
