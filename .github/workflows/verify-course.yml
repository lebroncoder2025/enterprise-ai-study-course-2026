name: Verify course quality and media
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check course-guided.js
          node --check course-terms.js
          node --check course-explanations.js
          node --check course-core.js
          node --check course-ml.js
          node --check course-enterprise.js
          node --check course-extra.js
          node --check course-media.js
          node --check course-rag-lab.js
          node --check course-infrastructure.js
      - name: Verify HTML, local images and absence of employer references
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          root=Path('.')
          html=(root/'index.html').read_text(encoding='utf-8')
          assert 'course-guided.js' in html and 'course-guided.css' in html
          assert 'course-media.js' in html and 'course-rag-lab.js' in html
          assert 'course-interactive.css' in html
          assert 'course-infrastructure.js' in html and 'course-infrastructure.css' in html
          infra=(root/'course-infrastructure.js').read_text(encoding='utf-8')
          for marker in ['infra-api','infra-mcp','infra-azure','infra-case','infra-ops','infra-file-result','infra-api-send','infra-mcp-run']:
              assert marker in infra, marker
          for forbidden in [r'\bSIF\b',r'\bGSK\b',r'\bCRE\s*Risk\b',r'\bCHALLENGE\b']:
              assert not re.search(forbidden, infra, re.I), forbidden
          import xml.etree.ElementTree as ET
          for name in ['api_data_ai','mcp_host_client_server','azure_ai_infrastructure','ai_file_lifecycle']:
              diagram=root/'assets/diagrams'/f'{name}.svg'
              assert diagram.is_file(), diagram
              ET.parse(diagram)
          media=(root/'course-media.js').read_text(encoding='utf-8')
          rag=(root/'course-rag-lab.js').read_text(encoding='utf-8')
          assert media.count('"yt":')>=24, 'restored video collection'
          assert 'youtube-nocookie.com/embed/' in media and 'addEventListener("click"' in media
          for p in ['rag-role','rag-query','rag-mode','rag-topk','1/(60+']:
              assert p in rag, p
          assert not re.search(r'roche|rekrutacj|rozmow.{0,25}(techniczn|rekrutacyjn|liderem)', html, re.I)
          for fp in ['course-guided.js','course-guided.css','course-terms.js','course-terms.css','course-explanations.js','course-explanations.css','assets/screens/foundry.png','assets/diagrams/enterprise_rag.svg','course-media.js','course-rag-lab.js','course-interactive.css','course-infrastructure.js','course-infrastructure.css','assets/diagrams/api_data_ai.svg','assets/diagrams/mcp_host_client_server.svg','assets/diagrams/azure_ai_infrastructure.svg','assets/diagrams/ai_file_lifecycle.svg']:
              assert (root/fp).is_file(),fp
          for fp in ['guide-ml.mp4','guide-llm.mp4','guide-rag.mp4','guide-finetune.mp4','guide-agents.mp4','guide-mlops.mp4']:
              f=root/'assets/videos'/fp
              assert f.is_file() and f.stat().st_size>250000,fp
          class Check(HTMLParser):
              def handle_starttag(self,tag,attrs):
                  if tag not in ('script','link','img','source','video'):return
                  a=dict(attrs)
                  for prop in ('src','href'):
                      v=a.get(prop,'')
                      if not v or v.startswith(('https://','http://','data:','#','mailto:','javascript:')):continue
                      if v.startswith('/'):continue
                      path=v.split('?',1)[0].split('#',1)[0]
                      if re.search(r'\\.(?:html|css|js|png|jpg|webp|svg|mp4)$',path):
                          assert (root/path).exists(),(tag,path)
          Check().feed(html)
          print('HTML and media checks passed')
          PY
      - name: Install FFmpeg / ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Verify narrated MP4 contain audio
        run: |
          for video in assets/videos/guide-*.mp4; do
            ffprobe -v error -select_streams a -show_entries stream=codec_type -of csv=p=0 "$video" | grep -q audio
            ffprobe -v error -select_streams v -show_entries stream=codec_type -of csv=p=0 "$video" | grep -q video
          done
