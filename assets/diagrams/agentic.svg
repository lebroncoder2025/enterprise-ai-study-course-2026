<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 455" role="img"><title>Workflow i agent: gdzie leży decyzja?</title>
<rect width="1220" height="455" fill="#0c1d30"/>
<text x="34" y="48" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#e7f6fc">Workflow i agent: gdzie leży decyzja?</text>
<text x="34" y="76" font-family="Arial,sans-serif" font-size="15" fill="#a9c2d0">Stały przebieg nie jest „gorszy”: bywa bezpieczniejszy w regulowanych procesach</text>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8adccb"/></marker></defs>
<rect x="35" y="130" width="250" height="85" rx="14" fill="#18364a" stroke="#517588" stroke-width="1.5"/>
<text x="160.0" y="160.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#e7f6fc">Deterministic flow</text>
<text x="160.0" y="184.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#a9c2d0">Trigger → Search → Rule → Report</text>
<rect x="350" y="130" width="250" height="85" rx="14" fill="#18364a" stroke="#517588" stroke-width="1.5"/>
<text x="475.0" y="160.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#e7f6fc">Router</text>
<text x="475.0" y="184.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#a9c2d0">LLM wybiera A/B/C</text>
<rect x="665" y="130" width="250" height="85" rx="14" fill="#18364a" stroke="#517588" stroke-width="1.5"/>
<text x="790.0" y="160.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#e7f6fc">Planner–executor</text>
<text x="790.0" y="184.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#a9c2d0">LLM planuje + tools</text>
<rect x="980" y="130" width="220" height="85" rx="14" fill="#18364a" stroke="#517588" stroke-width="1.5"/>
<text x="1090.0" y="160.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#e7f6fc">Autonomous</text>
<text x="1090.0" y="184.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#a9c2d0">event + plan + tools</text>
<rect x="140" y="305" width="960" height="92" rx="14" fill="#1c5349" stroke="#517588" stroke-width="1.5"/>
<text x="620.0" y="351.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#e7f6fc">Wspólne granice bezpieczeństwa: tożsamość, tool scopes, approval, limity, tracing, evals</text>
<line x1="285" y1="173" x2="348" y2="173" stroke="#78e9ce" stroke-width="2.3" marker-end="url(#arr)"/>
<line x1="600" y1="173" x2="663" y2="173" stroke="#78e9ce" stroke-width="2.3" marker-end="url(#arr)"/>
<line x1="915" y1="173" x2="978" y2="173" stroke="#78e9ce" stroke-width="2.3" marker-end="url(#arr)"/>
<line x1="780" y1="215" x2="780" y2="303" stroke="#78e9ce" stroke-width="2.3" marker-end="url(#arr)"/>
<text x="780.0" y="250.0" text-anchor="middle" font-size="12" font-family="Arial,sans-serif" fill="#f3cf8b">kontrole</text>
<text x="1194" y="433" text-anchor="end" font-family="Arial,sans-serif" font-size="12" fill="#a9c2d0">SCHEMAT EDUKACYJNY · NIE JEST SCREENSHOTEM PRODUCENTA</text></svg>