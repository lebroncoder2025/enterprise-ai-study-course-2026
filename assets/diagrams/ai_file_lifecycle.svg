<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl des" viewBox="0 0 1180 630" width="1180" height="630"><title id="ttl">Przepływ analizy dokumentu z AI</title><desc id="des">Osiem etapów: upload, ekstrakcja, autoryzacja, opcjonalne indeksowanie, walidacja, LLM, człowiek i audyt z bezpiecznym sprzątaniem danych. Dane fikcyjne.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#09192b"/><stop offset="1" stop-color="#152b41"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7ce3d4"/></marker></defs><rect width="1180" height="630" rx="24" fill="url(#bg)"/><text x="38" y="53" fill="#ffffff" font-size="29" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Analiza pliku: co naprawdę robi backend?</text><rect x="38" y="93" width="545" height="93" rx="16" fill="#1b304b" stroke="#577d93" stroke-width="1.8"/><text x="53" y="128" fill="#91e9d7" font-size="19" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">01 • Upload</text><text x="53" y="159" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">POST /api/files · HTTPS</text><path d="M583 140 L597 140" fill="none" stroke="#7ce3d4" stroke-width="3" marker-end="url(#arr)"/><rect x="611" y="93" width="545" height="93" rx="16" fill="#153749" stroke="#577d93" stroke-width="1.8"/><text x="626" y="128" fill="#91e9d7" font-size="19" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">02 • Parsowanie</text><text x="626" y="159" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Wiersze, komórki, metadane</text><path d="M876 186 L876 199" fill="none" stroke="#7ce3d4" stroke-width="3" marker-end="url(#arr)"/><rect x="38" y="208" width="545" height="93" rx="16" fill="#1b304b" stroke="#577d93" stroke-width="1.8"/><text x="53" y="243" fill="#91e9d7" font-size="19" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">03 • Autoryzacja</text><text x="53" y="274" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Tożsamość, role, limity</text><path d="M583 255 L597 255" fill="none" stroke="#7ce3d4" stroke-width="3" marker-end="url(#arr)"/><rect x="611" y="208" width="545" height="93" rx="16" fill="#153749" stroke="#577d93" stroke-width="1.8"/><text x="626" y="243" fill="#91e9d7" font-size="19" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">04 • Indeks / retrieval</text><text x="626" y="274" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Opcjonalne, czasowe, ACL</text><path d="M876 301 L876 314" fill="none" stroke="#7ce3d4" stroke-width="3" marker-end="url(#arr)"/><rect x="38" y="323" width="545" height="93" rx="16" fill="#1b304b" stroke="#577d93" stroke-width="1.8"/><text x="53" y="358" fill="#91e9d7" font-size="19" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">05 • Walidacje</text><text x="53" y="389" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Reguły + analiza danych</text><path d="M583 370 L597 370" fill="none" stroke="#7ce3d4" stroke-width="3" marker-end="url(#arr)"/><rect x="611" y="323" width="545" height="93" rx="16" fill="#153749" stroke="#577d93" stroke-width="1.8"/><text x="626" y="358" fill="#91e9d7" font-size="19" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">06 • Wywołanie LLM</text><text x="626" y="389" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Wynik AI to propozycja</text><path d="M876 416 L876 429" fill="none" stroke="#7ce3d4" stroke-width="3" marker-end="url(#arr)"/><rect x="38" y="438" width="545" height="93" rx="16" fill="#1b304b" stroke="#577d93" stroke-width="1.8"/><text x="53" y="473" fill="#91e9d7" font-size="19" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">07 • Przegląd</text><text x="53" y="504" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Człowiek podejmuje decyzję</text><path d="M583 485 L597 485" fill="none" stroke="#7ce3d4" stroke-width="3" marker-end="url(#arr)"/><rect x="611" y="438" width="545" height="93" rx="16" fill="#153749" stroke="#577d93" stroke-width="1.8"/><text x="626" y="473" fill="#91e9d7" font-size="19" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">08 • Audyt / cleanup</text><text x="626" y="504" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Ślady + retencja + potwierdzenie</text><text x="45" y="583" fill="#f1d593" font-size="16" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Historia audytowa i kopie zapasowe wymagają odrębnych zasad; 24 h retencji nie oznacza usunięcia wszystkich danych.</text></svg>