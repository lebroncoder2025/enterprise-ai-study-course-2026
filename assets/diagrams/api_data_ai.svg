<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl des" viewBox="0 0 1180 400" width="1180" height="400"><title id="ttl">Żądanie API do danych i modelu AI</title><desc id="des">Przeglądarka wysyła HTTPS POST do backendu. Walidacja, autoryzacja i logika prowadzą do wyszukiwania, plików lub wywołania modelu, a wynik wraca w JSON.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#09192b"/><stop offset="1" stop-color="#152b41"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7ce3d4"/></marker></defs><rect width="1180" height="400" rx="24" fill="url(#bg)"/><text x="45" y="50" fill="#ffffff" font-size="30" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">API: od żądania do odpowiedzi</text><rect x="38" y="103" width="171" height="159" rx="16" fill="#18324b" stroke="#577d93" stroke-width="1.8"/><text x="53" y="138" fill="#91e9d7" font-size="19" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">1. Klient</text><text x="53" y="169" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">HTTPS + JSON</text><text x="53" y="195" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">POST /api/analyze</text><rect x="235" y="103" width="171" height="159" rx="16" fill="#18324b" stroke="#577d93" stroke-width="1.8"/><text x="250" y="138" fill="#91e9d7" font-size="19" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">2. Endpoint</text><text x="250" y="169" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Metoda + ścieżka</text><text x="250" y="195" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Kontrakt API</text><rect x="432" y="103" width="171" height="159" rx="16" fill="#18324b" stroke="#577d93" stroke-width="1.8"/><text x="447" y="138" fill="#91e9d7" font-size="19" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">3. Backend</text><text x="447" y="169" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Entra ID + role</text><text x="447" y="195" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Walidacja danych</text><rect x="629" y="103" width="171" height="159" rx="16" fill="#18324b" stroke="#577d93" stroke-width="1.8"/><text x="644" y="138" fill="#91e9d7" font-size="19" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">4. Logika</text><text x="644" y="169" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Przetwarzanie</text><text x="644" y="195" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Przygotowanie</text><rect x="826" y="103" width="156" height="159" rx="16" fill="#18324b" stroke="#577d93" stroke-width="1.8"/><text x="841" y="138" fill="#91e9d7" font-size="19" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">5. Usługi</text><text x="841" y="169" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Storage / Search</text><text x="841" y="195" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Model AI</text><rect x="1008" y="103" width="138" height="159" rx="16" fill="#18324b" stroke="#577d93" stroke-width="1.8"/><text x="1023" y="138" fill="#91e9d7" font-size="19" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">6. Wynik</text><text x="1023" y="169" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">JSON + status</text><text x="1023" y="195" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">200 / 4xx / 5xx</text><path d="M209 182 L226 182" fill="none" stroke="#7ce3d4" stroke-width="3" marker-end="url(#arr)"/><path d="M406 182 L423 182" fill="none" stroke="#7ce3d4" stroke-width="3" marker-end="url(#arr)"/><path d="M603 182 L620 182" fill="none" stroke="#7ce3d4" stroke-width="3" marker-end="url(#arr)"/><path d="M800 182 L817 182" fill="none" stroke="#7ce3d4" stroke-width="3" marker-end="url(#arr)"/><path d="M982 182 L999 182" fill="none" stroke="#7ce3d4" stroke-width="3" marker-end="url(#arr)"/><rect x="38" y="300" width="1108" height="70" rx="16" fill="#193447" stroke="#577d93" stroke-width="1.8"/><text x="53" y="335" fill="#91e9d7" font-size="19" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Ważne</text><text x="53" y="366" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">API to kontrakt wymiany danych. Wykorzystanie modelu AI jest jednym z możliwych wywołań backendu.</text></svg>