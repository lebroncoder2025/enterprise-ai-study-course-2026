" font-family="Inter,Segoe UI,Arial,sans-serif">Azure AI Search</text><text x="351" y="527" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Indeks i retrieval</text><text x="351" y="553" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">ACL + wersje + top-K</text><rect x="632" y="461" width="260" height="150" rx="16" fill="#18324b" stroke="#577d93" stroke-width="1.8"/><text x="647" y="496" fill="#91e9d7" font-size="19" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Azure OpenAI / LLM</text><text x="647" y="527" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Endpoint modelu</text><text x="647" y="553" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Prompt + kontekst</text><rect x="928" y="461" width="210" height="150" rx="16" fill="#18324b" stroke="#577d93" stroke-width="1.8"/><text x="943" y="496" fill="#91e9d7" font-size="19" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Microsoft Foundry</text><text x="943" y="527" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Modele, evals</text><text x="943" y="553" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Eksperymenty / ślady</text><path d="M466 399 L466 448" fill="none" stroke="#7ce3d4" stroke-width="3" marker-end="url(#arr)"/><path d="M172 399 L172 448" fill="none" stroke="#7ce3d4" stroke-width="3" marker-end="url(#arr)"/><path d="M763 399 L763 448" fill="none" stroke="#7ce3d4" stroke-width="3" marker-end="url(#arr)"/><text x="52" y="660" fill="#f6d58d" font-size="17" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">App Service Environment (ASE) to opcjonalne izolowane środowisko hostingu; nie jest synonimem pojedynczej aplikacji.</text></svg>