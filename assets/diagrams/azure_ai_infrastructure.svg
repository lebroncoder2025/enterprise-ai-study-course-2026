<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl des" viewBox="0 0 1180 700" width="1180" height="700"><title id="ttl">Architektura przykładowej aplikacji AI w Azure</title><desc id="des">Front Door lub Application Gateway kieruje ruch do dwóch aplikacji. Entra ID tożsamość, App Service backend, Managed Identity do Blob Storage, Search, Key Vault i LLM, monitorowanie; Foundry to zarządzanie modelami.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#09192b"/><stop offset="1" stop-color="#152b41"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7ce3d4"/></marker></defs><rect width="1180" height="700" rx="24" fill="url(#bg)"/><text x="42" y="52" fill="#ffffff" font-size="30" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Azure: przepływ przez warstwy infrastruktury</text><rect x="42" y="91" width="224" height="125" rx="16" fill="#18324b" stroke="#577d93" stroke-width="1.8"/><text x="57" y="126" fill="#91e9d7" font-size="19" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Przeglądarka</text><text x="57" y="157" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Użytkownik / HTTPS</text><text x="57" y="183" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Frontend web</text><rect x="337" y="91" width="278" height="125" rx="16" fill="#18324b" stroke="#577d93" stroke-width="1.8"/><text x="352" y="126" fill="#91e9d7" font-size="19" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Gateway / routing</text><text x="352" y="157" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Front Door / App Gateway</text><text x="352" y="183" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Ścieżki do różnych aplikacji</text><rect x="699" y="77" width="440" height="153" rx="16" fill="#18324b" stroke="#577d93" stroke-width="1.8"/><text x="714" y="112" fill="#91e9d7" font-size="19" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">App Service / backend API</text><text x="714" y="143" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Python / FastAPI + Uvicorn (przykład)</text><text x="714" y="169" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Logika, role, walidacja, wywołania usług</text><path d="M266 152 L325 152" fill="none" stroke="#7ce3d4" stroke-width="3" marker-end="url(#arr)"/><path d="M615 152 L687 152" fill="none" stroke="#7ce3d4" stroke-width="3" marker-end="url(#arr)"/><rect x="42" y="262" width="259" height="137" rx="16" fill="#18324b" stroke="#577d93" stroke-width="1.8"/><text x="57" y="297" fill="#91e9d7" font-size="19" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Entra ID / Easy Auth</text><text x="57" y="328" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Login (authentication)</text><text x="57" y="354" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Role aplikacji (authorization)</text><rect x="339" y="262" width="258" height="137" rx="16" fill="#18324b" stroke="#577d93" stroke-width="1.8"/><text x="354" y="297" fill="#91e9d7" font-size="19" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Managed Identity</text><text x="354" y="328" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Tożsamość backendu</text><text x="354" y="354" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Role RBAC do zasobów</text><rect x="643" y="262" width="234" height="137" rx="16" fill="#18324b" stroke="#577d93" stroke-width="1.8"/><text x="658" y="297" fill="#9