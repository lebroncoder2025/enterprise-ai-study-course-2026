<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl des" viewBox="0 0 1180 460" width="1180" height="460"><title id="ttl">MCP host, klient i serwery narzędzi</title><desc id="des">Host aplikacji utrzymuje połączenia przez klientów MCP do niezależnych serwerów. Model może zaproponować narzędzie, ale host sprawdza uprawnienia i wykonuje akcję.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#09192b"/><stop offset="1" stop-color="#152b41"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#7ce3d4"/></marker></defs><rect width="1180" height="460" rx="24" fill="url(#bg)"/><text x="40" y="54" fill="#ffffff" font-size="28" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">MCP: nie model, lecz protokół połączenia z narzędziami</text><rect x="42" y="112" width="232" height="142" rx="16" fill="#18324b" stroke="#577d93" stroke-width="1.8"/><text x="57" y="147" fill="#91e9d7" font-size="19" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Host / aplikacja</text><text x="57" y="178" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Użytkownik + LLM</text><text x="57" y="204" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Zgody i polityki</text><rect x="334" y="112" width="225" height="142" rx="16" fill="#18324b" stroke="#577d93" stroke-width="1.8"/><text x="349" y="147" fill="#91e9d7" font-size="19" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">MCP client</text><text x="349" y="178" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Sesja do serwera</text><text x="349" y="204" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Wysyła wywołanie</text><rect x="632" y="79" width="230" height="93" rx="16" fill="#18324b" stroke="#577d93" stroke-width="1.8"/><text x="647" y="114" fill="#91e9d7" font-size="19" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Serwer MCP A</text><text x="647" y="145" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Pliki i dokumenty</text><rect x="632" y="202" width="230" height="93" rx="16" fill="#18324b" stroke="#577d93" stroke-width="1.8"/><text x="647" y="237" fill="#91e9d7" font-size="19" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Serwer MCP B</text><text x="647" y="268" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Wyszukiwanie danych</text><rect x="906" y="139" width="233" height="117" rx="16" fill="#18324b" stroke="#577d93" stroke-width="1.8"/><text x="921" y="174" fill="#91e9d7" font-size="19" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Serwer MCP C</text><text x="921" y="205" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">Akcje przez API</text><text x="921" y="231" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">(kontrolowany dostęp)</text><path d="M274 179 L322 179" fill="none" stroke="#7ce3d4" stroke-width="3" marker-end="url(#arr)"/><path d="M559 166 L620 129" fill="none" stroke="#7ce3d4" stroke-width="3" marker-end="url(#arr)"/><path d="M559 185 L620 247" fill="none" stroke="#7ce3d4" stroke-width="3" marker-end="url(#arr)"/><path d="M862 184 L895 195" fill="none" stroke="#7ce3d4" stroke-width="3" marker-end="url(#arr)"/><rect x="42" y="325" width="1097" height="94" rx="16" fill="#21374b" stroke="#577d93" stroke-width="1.8"/><text x="57" y="360" fill="#91e9d7" font-size="19" font-weight="700" font-family="Inter,Segoe UI,Arial,sans-serif">Pętla działania</text><text x="57" y="391" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">1. Model proponuje narzędzie   →   2. Host weryfikuje zgodę i argumenty   →   3. Serwer wykonuje operację</text><text x="57" y="417" fill="#f1f7fb" font-size="15" font-weight="400" font-family="Inter,Segoe UI,Arial,sans-serif">4. Wynik wraca do hosta   →   5. Host podaje wynik modelowi i przygotowuje odpowiedź</text></svg>