<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-labelledby="t d"><title id="t">Multimodal AI pipeline</title><desc id="d">Protected image, audio or video data is validated, preprocessed, evaluated by a model and checked before output.</desc><defs><style>.b{fill:#122335;stroke:#2c6274;stroke-width:2}.t{fill:#eaf3f8;font:700 20px sans-serif}.s{fill:#aac0ce;font:15px sans-serif}.a{stroke:#26d7c4;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#26d7c4"/></marker></defs><rect width="1100" height="300" rx="22" fill="#091523"/><g><rect class="b" x="25" y="90" width="170" height="120" rx="16"/><text class="t" x="50" y="135">Image / audio</text><text class="s" x="50" y="165">input + metadata</text><rect class="b" x="245" y="90" width="170" height="120" rx="16"/><text class="t" x="273" y="135">Validate</text><text class="s" x="269" y="165">type · size · access</text><rect class="b" x="465" y="90" width="170" height="120" rx="16"/><text class="t" x="492" y="135">Preprocess</text><text class="s" x="489" y="165">OCR · ASR · frames</text><rect class="b" x="685" y="90" width="170" height="120" rx="16"/><text class="t" x="715" y="135">Model</text><text class="s" x="706" y="165">extract / interpret</text><rect class="b" x="905" y="90" width="170" height="120" rx="16"/><text class="t" x="930" y="135">Verify output</text><text class="s" x="929" y="165">schema · human review</text><path class="a" d="M195 150H235M415 150H455M635 150H675M855 150H895"/></g></svg>