<text x="780.0" y="327.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#a9c2d0">zbiory testowe i porównania</text>
<rect x="975" y="120" width="210" height="250" rx="14" fill="#18364a" stroke="#517588" stroke-width="1.5"/>
