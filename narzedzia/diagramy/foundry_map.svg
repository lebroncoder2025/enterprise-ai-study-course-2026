<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 450" role="img"><title>Microsoft Foundry — mapa funkcji w projekcie</title>
<rect width="1220" height="450" fill="#0c1d30"/>
<text x="34" y="48" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#e7f6fc">Microsoft Foundry — mapa funkcji w projekcie</text>
<text x="34" y="76" font-family="Arial,sans-serif" font-size="15" fill="#a9c2d0">To lokalny schemat nawigacji, a nie zrzut interfejsu Microsoft</text>
