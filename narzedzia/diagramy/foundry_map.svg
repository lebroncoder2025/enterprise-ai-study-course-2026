<text x="455.0" y="163.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#e7f6fc">Discover → Models</text>
<text x="455.0" y="187.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#a9c2d0">wybór wariantu i regionu</text>
<rect x="325" y="260" width="260" height="110" rx="14" fill="#18364a" stroke="#517588" stroke-width="1.5"/>
<text x="455.0" y="303.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#e7f6fc">Deploy model</text>
<text x="455.0" y="327.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#a9c2d0">endpoint, deployment name</text>
