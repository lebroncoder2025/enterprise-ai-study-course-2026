<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 492" role="img" aria-labelledby="title desc"><title id="title">Warstwy kontekstu LLM</title><desc id="desc">Diagram pokazuje kontekst budowany z instrukcji, wiadomości użytkownika, historii, wyników Search i tool output, a także oddzielne kontrole dostępu.</desc><defs><style>text{font-family:Arial, sans-serif;fill:#e9f8fa}.h{font-size:23px;font-weight:700}.s{font-size:15px}.xs{font-size:13px;fill:#a9c8d7}.box{fill:#173149;stroke:#42859a;stroke-width:1.5}.low{fill:#2d3c51;stroke:#cc9d65}.safe{fill:#15382f;stroke:#4da990}.ln{fill:none;stroke:#75d8c9;stroke-width:3}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#75d8c9"/></marker></defs><rect width="980" height="492" rx="18" fill="#0d1f30"/><text x="30" y="41" class="h">Z czego runtime składa kontekst odpowiedzi?</text><rect x="36" y="80" width="275" height="88" rx="10" class="box"/><text x="51" y="108" class="h" font-size="19">01. Instructions</text><text x="51" y="136" class="s">Zasady systemu / aplikacji</text><rect x="352" y="80" width="275" height="88" rx="10" class="box"/><text x="367" y="108" class="h">02. User</text><text x="367" y="136" class="s">Pytanie lub zadanie</text><rect x="669" y="80" width="275" height="88" rx="10" class="box"/><text x="684" y="108" class="h">03. History</text><text x="684" y="136" class="s">O ile jest dołączona</text><rect x="36" y="202" width="275" height="88" rx="10" class="low"/><text x="51" y="231" class="h">04. RAG / Search</text><text x="51" y="258" class="s">Fragmenty źródeł — dane</text><rect x="352" y="202" width="275" height="88" rx="10" class="low"/><text x="367" y="231" class="h">05. Tool result</text><text x="367" y="258" class="s">Wynik Pythona / API</text><rect x="669" y="202" width="275" height="88" rx="10" class="safe"/><text x="684" y="231" class="h">06. Access checks</text><text x="684" y="258" class="s">Kontrola w backendzie</text><path class="ln" d="M 180 168 L 180 187 L 490 187 L 490 202"/><path class="ln" d="M 490 168 L 490 187"/><path class="ln" d="M 806 168 L 806 187 L 490 187"/><path class="ln" d="M 180 290 L 180 324 L 490 324"/><path class="ln" d="M 490 290 L 490 324"/><path class="ln" d="M 806 290 L 806 324 L 490 324"/><path d="M 490 324 L 490 359" class="ln" marker-end="url(#arrow)"/><rect x="290" y="363" width="400" height="84" rx="12" fill="#21565a" stroke="#66d9c7" stroke-width="2"/><text x="310" y="393" class="h">LLM — inferencja</text><text x="310" y="421" class="s">Odpowiedź lub kolejne wywołanie toola</text><text x="37" y="475" class="xs">Schemat edukacyjny · nie pokazuje rzeczywistych ukrytych promptów dowolnego dostawcy.</text></svg>
