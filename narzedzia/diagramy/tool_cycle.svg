<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" role="img" aria-labelledby="title desc"><title id="title">Kiedy Code Interpreter jest uruchamiany</title><desc id="desc">Schemat request user, dostępny tool, LLM wybiera tool call, runtime autoryzuje i wywołuje sandbox, wynik wraca do modelu.</desc><defs><style>text{font-family:Arial,sans-serif;fill:#eaf6fb}.h{font-size:17px;font-weight:700}.s{font-size:13px}.x{font-size:13px;fill:#bad1dd}.b{fill:#183147;stroke:#5698a8;stroke-width:1.5}.t{fill:#15483d;stroke:#61b6a0}.warn{fill:#403447;stroke:#af8a76}.a{stroke:#6ce2cb;stroke-width:3;fill:none}</style><marker id="end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#6ce2cb"/></marker></defs><rect width="980" height="380" rx="18" fill="#0c1b2b"/><text x="34" y="44" font-size="23" font-weight="700">Code Interpreter: moment decyzji i pętla narzędzi</text><rect x="34" y="82" width="210" height="92" rx="11" class="b"/><text x="49" y="112" class="h">1 · Żądanie</text><text x="49" y="135" class="s">Pytanie + konfiguracja</text><text x="49" y="156" class="s">tools / tool_choice</text><rect x="286" y="82" width="200" height="92" rx="11" class="t"/><text x="301" y="112" class="h">2 · LLM</text><text x="301" y="135" class="s">Wybiera tool call</text><text x="301" y="156" class="s">(jeśli jest dozwolony)</text><rect x="530" y="82" width="195" height="92" rx="11" class="b"/><text x="545" y="112" class="h">3 · Runtime</text><text x="545" y="135" class="s">Sprawdza polityki</text><text x="545" y="156" class="s">i uruchamia sandbox</text><rect x="767" y="82" width="175" height="92" rx="11" class="warn"/><text x="782" y="112" class="h">4 · Python</text><text x="782" y="135" class="s">Wykonuje kod</text><text x="782" y="156" class="s">i zwraca wynik</text><path class="a" d="M244 129 L276 129" marker-end="url(#end)"/><path class="a" d="M486 129 L520 129" marker-end="url(#end)"/><path class="a" d="M725 129 L757 129" marker-end="url(#end)"/><path class="a" d="M851 174 L851 224 L386 224 L386 242" marker-end="url(#end)"/><rect x="286" y="246" width="440" height="74" rx="12" class="t"/><text x="301" y="276" class="h">5 · Wynik wraca do kontekstu LLM</text><text x="301" y="301" class="s">Model może odpowiedzieć lub wykonać kolejny krok</text><text x="34" y="354" class="x">Schemat edukacyjny · kod wykonuje sandbox, nie macierz wag LLM.</text></svg>
