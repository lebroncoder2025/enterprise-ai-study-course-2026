tton class="btn ${state.videoDone[v.id]?'secondary':'primary'}" data-action="video-done" data-id="${E(v.id)}">${state.videoDone[v.id]?'✓ Potwierdzono naukę — cofnij':'✓ Zaliczyłem materiał i rozumiem'}</button>${btn('Przećwicz w laboratorium →','lab/'+(v.lab||byId(v.lesson).lab),'secondary')}</div><p class="video-note">To Twoje potwierdzenie. Aplikacja nie może zweryfikować, czy film został obejrzany od początku do końca. Zalicz po rzeczywistym przerobieniu zadania.</p></section><section class="panel" style="margin-top:20px"><h2>Moje wyjaśnienie własnymi słowami</h2><p>Napisz w 3 zdaniach: co było wejściem, co było obliczeniem i co wyszło. Zapis jest prywatny i działa offline.</p><textarea class="form-textarea" data-video-note="${E(id)}" placeholder="Nie kopiuj definicji. Wyjaśnij mechanizm na swoim przykładzie...">${E(state.videoNotes[id]||'')}</textarea></section></div><aside class="watch-aside"><section class="panel"><h3>Powiązana nauka</h3>${btn('Przeczytaj lekcję','lesson/'+v.lesson,'secondary')}${btn('Zrób laboratorium','lab/'+(v.lab||byId(v.lesson).lab),'secondary')}${btn('Wszystkie filmy','videos','secondary')}</section>${sources.length?`<section class="panel"><h3>Materiały źródłowe</h3>${sources.map(r=>`<p class="watch-resource"><a href="${E(r.url)}" target="_blank" rel="noopener noreferrer">${E(r.title)} ↗</a></p>`).join('')}</section>`:''}${siblings.length?`<section class="panel"><h3>Kontynuuj temat</h3>${siblings.map(x=>`<p class="watch-resource"><a href="#/video/${E(x.id)}">${E(x.title)} →</a></p>`).join('')}</section>`:''}</aside></div>`,'ODTWARZACZ + AKTYWNA NAUKA');}
function llmPipeline(){let x=state.lab.llmchain||{country:'pl',bonus:0,temp:1};let input=x.country==='pl'?[1,0]:[0,1];let rows=[{id:42,text:'Warszawa',weights:[3.0,-1.2],bias:.3},{id:43,text:'Kraków',weights:[1.4,.1],bias:0},{id:44,text:'Berlin',weights:[-1.0,3.2],bias:.3},{id:45,text:'Poznań',weights:[.8,.2],bias:0}];let out=rows.map(r=>({...r,z:r.weights[0]*input[0]+r.weights[1]*input[1]+r.bias+(r.id===42?Number(x.bonus):0)}));let T=Math.max(.1,Number(x.temp)),zmax=Math.max(...out.map(r=>r.z/T)),exps=out.map(r=>Math.exp(r.z/T-zmax)),sum=exps.reduce((a,b)=>a+b);out.forEach((r,i)=>r.p=exps[i]/sum);let winner=[...out].sort((a,b)=>b.p-a.p)[0];const code=`wejście: ${x.country==='pl'?'„Jaka jest stolica Polski?”':'„Jaka jest stolica Niemiec?”'}\nidentyfikatory tokenów: [11, 12, 13, ${x.country==='pl'?14:15}]\nwektor kontekstu (UMOWNY): [${input.join(', ')}]\nwynik: token ID ${winner.id} → „${winner.text}”`;
layout(`${H('Od pytania do słowa „Warszawa”','Nowe laboratorium — pokażę Ci dokładnie, gdzie jest słownik, gdzie są liczby wag i jak wynik zmienia się w token.')}<div class="video-alert"><b>Uczciwe ograniczenie:</b> ten model jest celowo mikroskopijny. Słownik, wektory i wagi są syntetyczne. Obliczenia macierz–wektor, bias i softmax są rzeczywiste. Prawdziwy transformer ma wiele warstw, attention i setki tysięcy tokenów.</div><div class="lab-grid"><div class="panel"><h2>Krok 1. Tekst i słownik tokenów</h2><p>Tokenizer potrafi zmienić tekst na token ID i zamienić wybrane ID z powrotem na tekst. To jest źródło napisu „Warszawa” — <b>nie jest on ukryty w surowej liczbie wagi</b>.</p><div class="token-row">${[['11','Jaka'],['12','jest'],['13','stolica'],['14','Polski'],['15','Niemiec'],['42','Warszawa'],['43','Kraków'],['44','Berlin'],['45','Poznań']].map(([id,t])=>`<span class="toy-token"><small>ID ${id}</small>${t}</span>`).join('')}</div><h2 style="margin-top:30px">Krok 2. Wybierz kontekst</h2><label class="lab-field">Pytanie <select data-lab="llmchain" data-field="country"><option value="pl" ${x.country==='pl'?'selected':''}>Jaka jest stolica Polski?</option><option value="de" ${x.country==='de'?'selected':''}>Jaka jest stolica Niemiec?</option></select></label><p>Wektor umowny: <code>[Polska=${input[0]}, Niemcy=${input[1]}]</code>. W prawdziwym LLM taki kontekst jest wielowymiarowy i powstaje przez kolejne warstwy.</p><h2>Krok 3. Macierz wag W × wektor x + b</h2><p>Każdy wiersz macierzy wyjściowej przypisany jest do określonego ID tokenu, a jego <b>liczby</b> określają wynik. Zmieniaj bonus wagi Warszawy i obserwuj, jak zmienia się prawdopodobieństwo.</p><label class="lab-field">Dodatkowy wpływ na wynik Warszawy: <output>${fmt(Number(x.bonus),1)}</output><input type="range" min="-4" max="4" step=".2" data-lab="llmchain" data-field="bonus" value="${Number(x.bonus)}"></label><label class="lab-field">Temperatura softmax: <output>${fmt(Number(x.temp),1)}</output><input type="range" min="0.2" max="2.5" step=".1" data-lab="llmchain" data-field="temp" value="${Number(x.temp)}"></label><div class="table-scroll"><table class="weight-table"><thead><tr><th>Token</th><th>Waga PL</th><th>Waga DE</th><th>Bias</th><th>Logit</th><th>Po softmax</th></tr></thead><tbody>${out.map(r=>`<tr><td><strong>${r.text}</strong> <small>#${r.id}</small></td><td>${fmt(r.weights[0])}</td><td>${fmt(r.weights[1])}</td><td>${fmt(r.bias)}</td><td>${fmt(r.z,2)}</td><td><b>${fmt(r.p*100,1)}%</b></td></tr>`).join('')}</tbody></table></div><div class="prob-list">${out.map(r=>`<div><span>${r.text}</span><div class="prob-track"><i style="width:${(r.p*100).toFixed(2)}%"></i></div><b>${fmt(r.p*100,1)}%</b></div>`).join('')}</div><h2>Krok 4. ID z powrotem na tekst</h2><div class="pipeline-result"><code>${E(code)}</code></div><p>Właśnie dlatego model może działać offline: tokenizator zawiera słownik możliwych jednostek tekstu, a plik wag zawiera wyuczony mechanizm nadawania im wyników. <b>Nie ma potrzeby użycia Internetu ani tabeli „Polska = Warszawa” podczas inferencji.</b></p><div class="button-row">${btn('Zobacz wideo 3Blue1Brown','video/transformer','primary')}${btn('Odpowiedz na quiz LLM','lesson/llm','secondary')}</div></div><aside class="panel"><h3>Jak czytać te liczby?</h3><p><b>Wagi:</b> dwie liczby w każdym wierszu (dla Polski i Niemiec).</p><p><b>Logit:</b> iloczyn skalarny wiersza wag i wektora + bias.</p><p><b>Softmax:</b> wszystkie logity przeliczane na wspólny rozkład prawdopodobieństwa.</p><p><b>Decoder:</b> wybrany token ID 42 staje się tekstem „Warszawa”.</p><div class="note">Prawdziwy językowy model przewiduje kolejne tokeny, nie losuje z ręcznej tabeli 4 miast. Tu pokazujemy mechanikę końcówki modelu na małej skali.</div></aside></div>`,'NOWE LABORATORIUM · WEKTORY');}

function render(){menuOpen=false;let r=route();const y=window.scrollY;switch(r.page){case 'home':home();break;case 'lesson':lesson(r.id);break;case 'labs':labsIndex();break;case 'lab':labPage(r.id);break;case 'cards':flashView();break;case 'exam':examView();break;case 'practice':practice();break;case 'case':casePage(r.id);break;case 'sources':sources();break;case 'videos':videosIndex();break;case 'video':videoPage(r.id);break;case 'paths':pathsIndex();break;case 'path':pathPage(r.id);break;case 'lab-llm':llmPipeline();break;default:home()}scrollTop()}
function updateKeepScroll(){const y=window.scrollY;let r=route();switch(r.page){case 'lesson':lesson(r.id);break;case 'lab':labPage(r.id);break;case 'cards':flashView();break;case 'exam':examView();break;case 'case':casePage(r.id);break;case 'video':videoPage(r.id);break;case 'videos':videosIndex();break;case 'lab-llm':llmPipeline();break;default:render()}window.scrollTo({top:y,behavior:'instant'})}
function onLab(field,id,value){const defaults={tokens:{country:'PL',cue:1,temperature:1},evaluation:{mode:'hybrid',k:3},retrieval:retrievalInit(),llmchain:{country:'pl',bonus:0,temp:1},cost:{in:2200,out:550,requests:250,days:22,pi:.8,po:4,search:0},confusion:{threshold:.5}};let ob={...(id==='gradient'?gradientInit():(defaults[id]||{})),...(state.lab[id]||{})};if(field==='preset'){if(value!=='')ob.q=C.gold[+value].q}else if(field==='archived'||id==='architecture')ob[field]=!!value;else if(['cue','temperature','lr','threshold','k','in','out','requests','days','pi','po','search','bonus','temp'].includes(field))ob[field]=Number(value);else ob[field]=value;state.lab[id]=ob;save();updateKeepScroll()}
document.addEventListener('click',e=>{let a=e.target.closest('[data-action]');let link=e.target.closest('[data-route]');if(link){go(link.dataset.route);return}let sc=e.target.closest('[data-scroll]');if(sc){S('#'+sc.dataset.scroll)?.scrollIntoView({behavior:'smooth',block:'start'});return}if(!a)return;let d=a.dataset,act=d.action;if(act==='menu-toggle'){menuOpen=!menuOpen;S('#sidebar')?.classList.toggle('open',menuOpen);S('#mobileShade')?.classList.toggle('show',menuOpen);return}if(act==='menu-close'){menuOpen=false;S('#sidebar')?.classList.remove('open');S('#mobileShade')?.classList.remove('show');return}
if(act==='video-play'){const v=videoById(d.id);if(!v)return;const host=S('#video-frame-'+v.id);if(host){const localAnimations={nn:'tokens',ml:'weights',search:'search',rag:'rag',azure:'azure',agents:'agents',eval:'eval',ops:'ops',compliance:'compliance',nlp:'supervised',metrics:'model',cases:'agents'};const clip=localAnimations[v.lesson];const original='https://www.youtube.com/watch?v='+v.yt+(v.start?'&t='+v.start+'s':'');if(clip){host.innerHTML=`<div style="padding:12px"><div style="color:#a8bdc7;font-size:12px;margin:4px 0 10px">Offline Polish animation for this topic ? illustrative, no voice-over</div><video controls playsinline preload="metadata" style="width:100%;aspect-ratio:16/9;background:#081520;border-radius:10px" src="../filmy_pl/${clip}.mp4" aria-label="Offline animation: ${E(v.title)}"></video><div style="padding:9px 2px;font-size:12px;color:#a8bdc7">The cited full lecture is optional. <a href="${E(original)}" target="_blank" rel="noopener" style="color:#37d1c1">Open original at its publisher</a></div></div>`;}else{const f=document.createElement('iframe');f.setAttribute('title','Film: '+v.title);f.setAttribute('allow','accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');f.setAttribute('referrerpolicy','strict-origin-when-cross-origin');f.setAttribute('allowfullscreen','');f.setAttribute('loading','lazy');f.src='https://www.youtube-nocookie.com/embed/'+v.yt+'?rel=0&cc_load_policy=1&start='+(v.start||0);host.replaceChildren(f);host.classList.add('playing');}}return}
if(act==='video-check'){let v=videoById(d.id);if(!v)return;if(state.videoAnswers[d.id]!==undefined)return;state.videoAnswers[d.id]=+d.choice;save();updateKeepScroll();return}
if(act==='video-retry'){delete state.videoAnswers[d.id];save();updateKeepScroll();return}
if(act==='video-done'){let v=videoById(d.id);if(!v)return;if(state.videoDone[d.id]){delete state.videoDone[d.id];save();updateKeepScroll();return}if(state.videoAnswers[d.id]!==v.quiz.ok){toast('Najpierw rozwiąż poprawnie pytanie kontrolne.');return}state.videoDone[d.id]=new Date().toISOString();save();updateKeepScroll();toast('Zapisano potwierdzenie nauki.');return}
if(act==='quiz-pick'){let l=byId(d.lesson),q=l.quiz.find(q=>q.id===d.id);if(state.answers[l.id]?.[q.id]!==undefined)return;state.answers[l.id]??={};state.answers[l.id][q.id]=+d.value;if(+d.value!==q.ok&&!state.activity.includes(q.id))state.activity.push(q.id);if(Object.keys(state.answers[l.id]).length===l.quiz.length){let num=l.quiz.filter(q=>state.answers[l.id][q.id]===q.ok).length;state.scores[l.id]=Math.max(state.scores[l.id]||0,Math.round(100*num/l.quiz.length));if(num===l.quiz.length)toast('Wszystkie odpowiedzi poprawne!')}save();updateKeepScroll();return}
if(act==='quiz-reset'){state.answers[d.id]={};save();updateKeepScroll();return}if(act==='bookmark'){state.bookmarks[d.id]=!state.bookmarks[d.id];save();toast(state.bookmarks[d.id]?'Dodano do powtóthe learner.':'Usunięto z zakładek.');return}
if(act==='flash-filter'){flashFilter=d.v;flashIndex=0;flashFlip=false;updateKeepScroll();return}if(act==='flash-flip'){flashFlip=!flashFlip;updateKeepScroll();return}if(act==='flash-prev'){flashIndex=Math.max(0,flashIndex-1);flashFlip=false;updateKeepScroll();return}if(act==='flash-next'){flashIndex++;flashFlip=false;updateKeepScroll();return}if(act==='flash-grade'){let q=allQ.find(q=>q.id===d.id),old=state.cards[q.id]||{streak:0};let grade=+d.v;let streak=grade===2?old.streak+1:0;let days=grade===0?0:grade===1?1:[3,7,14,30,60][Math.min(4,streak-1)];state.cards[q.id]={streak,due:Date.now()+days*86400000,last:Date.now()};save();flashFlip=false;flashIndex++;updateKeepScroll();return}
if(act==='exam-start'){examStart();return}if(act==='exam-go'){exam.pos=+d.v;updateKeepScroll();return}if(act==='exam-prev'){exam.pos=Math.max(0,exam.pos-1);updateKeepScroll();return}if(act==='exam-next'){exam.pos=Math.min(exam.qs.length-1,exam.pos+1);updateKeepScroll();return}if(act==='exam-cancel'){if(confirm('Anulować bieżące podejście?')){exam=null;examView()}return}if(act==='exam-finish'){if(Object.keys(exam.ans).length<exam.qs.length)return;let right=exam.qs.filter(q=>exam.ans[q.id]===q.ok).length;exam.result=Math.round(100*right/exam.qs.length);exam.done=true;state.examBest=Math.max(exam.result,state.examBest||0);state.examHistory.push({date:new Date().toISOString(),score:exam.result});for(let q of exam.qs)if(exam.ans[q.id]!==q.ok&&!state.activity.includes(q.id))state.activity.push(q.id);save();examView();scrollTop();return}
if(act==='gradient-step'){gradientStep(+d.count);updateKeepScroll();return}if(act==='gradient-reset'){state.lab.gradient=gradientInit();save();updateKeepScroll();return}if(act==='risk-reset'){state.lab.risk={};save();updateKeepScroll();return}if(act==='decision-reset'){state.lab.decision={};save();updateKeepScroll();return}if(act==='scenario-pick'||act==='decision-pick'){let k=act==='scenario-pick'?'risk':'decision';let x=state.lab[k]||{};x[d.i]=+d.v;state.lab[k]=x;save();updateKeepScroll();return}if(act==='case-reveal'){let x=state.cases[d.id]||{};x.show=!x.show;state.cases[d.id]=x;save();updateKeepScroll();return}
if(act==='speak'){speakLesson(d.id);return}if(act==='stop-speech'){stopSpeech();toast('Zatrzymano czytanie.');return}
if(act==='export'){download('AI-STUDY-LAB-postep.json','application/json;charset=utf-8',JSON.stringify({app:'pharmaceutical organization-ai-lab',schema:3,exported:new Date().toISOString(),state},null,2));toast('Zapis wyeksportowano.');return}if(act==='reset'){if(confirm('Usunąć wszystkie lokalne wyniki, notatki i fiszki?')){state=defaultState();save();render();toast('Postęp wyczyszczony.')}return}
});
document.addEventListener('change',e=>{let t=e.target;if(t.id==='videoFilter'){videoFilter=t.value;updateKeepScroll();return}if(t.id==='videoLevel'){videoLevel=t.value;updateKeepScroll();return}if(t.dataset.lab){if(t.type==='checkbox')onLab(t.dataset.field,t.dataset.lab,t.checked);else onLab(t.dataset.field,t.dataset.lab,t.value);return}if(t.name==='exam-choice'&&exam&&!exam.done){exam.ans[exam.qs[exam.pos].id]=+t.value;updateKeepScroll();return}if(t.dataset.caseCheck){let x=state.cases[t.dataset.caseCheck]||{};x.checks??=[];x.checks[+t.dataset.i]=t.checked;state.cases[t.dataset.caseCheck]=x;save();return}if(t.id==='importFile'){let f=t.files?.[0];if(!f||f.size>2000000){toast('Zbyt duży lub nieprawidłowy plik.');return}let r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(o.app!=='pharmaceutical organization-ai-lab'||o.schema!==3||!o.state||typeof o.state!=='object')throw Error('Niepoprawny format');if(!confirm('Import zastąpi lokalny postęp. Kontynuować?'))return;state={...defaultState(),...o.state};for(const k of ['read','answers','scores','cards','bookmarks','notes','cases','lab','videoDone','videoAnswers','videoNotes'])if(!state[k]||typeof state[k]!=='object'||Array.isArray(state[k]))state[k]={};if(!Array.isArray(state.activity))state.activity=[];save();render();toast('Zaimportowano postęp.')}catch(err){toast('Nie udało się wczytać pliku postępu.')}};r.readAsText(f);return}});
document.addEventListener('input',e=>{let t=e.target;if(t.dataset.videoNote){state.videoNotes[t.dataset.videoNote]=t.value;save();return}if(t.dataset.note){state.notes[t.dataset.note]=t.value;save();return}if(t.dataset.case){let x=state.cases[t.dataset.case]||{};x.text=t.value;state.cases[t.dataset.case]=x;save();return}if(t.dataset.lab&&t.type==='range'){let ob=state.lab[t.dataset.lab]||{};ob[t.dataset.field]=+t.value;state.lab[t.dataset.lab]=ob;save();let label=t.closest('.control')?.querySelector('output');if(label)label.textContent=fmt(+t.value,2);return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&menuOpen){menuOpen=false;S('#sidebar')?.classList.remove('open');S('#mobileShade')?.classList.remove('show')}if(e.key===' '&&e.target.matches('.flashcard')){e.preventDefault();flashFlip=!flashFlip;updateKeepScroll()}});
window.addEventListener('hashchange',()=>{stopSpeech();render()});render();
})();
</script></body></html>
